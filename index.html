<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title id="titreWebsite">Wiki Heartopia</title>
    <link rel="icon" type="image/x-icon" href="./icone/heart.ico">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="css/filters.css">
    <link rel="stylesheet" href="css/panels.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/wildlife.css">
    <link rel="stylesheet" href="css/admin-ui.css">
    <link rel="stylesheet" href="css/recipes.css">
</head>

<body>

    <div id="headerBar">
        <div id="headerLeft">
            <div id="userSettings">
                <div id="userSettingsLeft">
                    <div id="labelLangue" class="hobby-section-title">🌐 Langue</div>
                    <hr class="hobby-separator">
                    <button id="btnLangue" onclick="toggleLanguage()">🇫🇷 FR</button>
                </div>
                <div id="userSettingsRight">
                    <div id="labelServeur" class="hobby-section-title">🌍 Serveur</div>
                    <hr class="hobby-separator">
                    <select id="selectServeur" onchange="applyFilters()">
                        <option value="0">🇺🇸 America</option>
                        <option value="6">🌐 Global</option>
                        <option value="12">🌏 SEA</option>
                    </select>
                </div>
            </div>
        </div>
        <div id="headerCenter">
            <h1 id="titrePage">Wiki Heartopia</h1>
            <div id="modeSelector">
                <button id="btnUser" onclick="setMode('user')">👀 Mode utilisateur</button>
                <button id="btnAdmin" onclick="setMode('admin')">🔐 Mode admin</button>
            </div>
        </div>
        <div id="headerRight">
            <button id="btnTheme" onclick="toggleTheme()">☀️</button>
        </div>
    </div>

    <div id="tabBar">
        <button class="tab-btn active" onclick="switchTab('map')">🗺️ Carte interactive</button>
        <button class="tab-btn" onclick="switchTab('tab2')">📋 Faune obtenue</button>
        <button class="tab-btn" onclick="switchTab('recipes')">🍳 Recettes</button>
    </div>

    <div id="tabContainer">

        <div id="tab-map" class="tab-content active">
            <div id="map-layout">

                <div id="userColumn">
                    <div id="userPreferences">
                        <div id="filterToggle" class="hobby-section-title" style="cursor:pointer;">
                            <span id="labelFiltres">Filtres</span> ▼
                        </div>
                        <div id="hobbyPanel">
                            <div id="labelMeteo" class="hobby-section-title">☁️ Météo actuelle</div>
                            <hr class="hobby-separator">
                            <div class="hobby-row" style="margin-top: 4px;">
                                <label>
                                    <input type="radio" name="meteoMode" id="meteoModeOu" value="ou" checked>
                                    <span id="labelMeteoModeOu">Au moins une</span>
                                </label>
                                <label>
                                    <input type="radio" name="meteoMode" id="meteoModeEt" value="et">
                                    <span id="labelMeteoModeEt">Exactement</span>
                                </label>
                            </div>
                            <div class="hobby-row">
                                <label><input type="checkbox" class="meteo-cb" value="soleil" checked> <span>☀️ <span class="meteo-label-soleil">Soleil</span></span></label>
                                <label><input type="checkbox" class="meteo-cb" value="pluie" checked> <span>🌧️ <span class="meteo-label-pluie">Pluie</span></span></label>
                                <label><input type="checkbox" class="meteo-cb" value="arc-en-ciel" checked> <span>🌈 <span class="meteo-label-arc">Arc-en-ciel</span></span></label>
                            </div>

                            <hr class="hobby-separator">
                            <div id="labelHoraires" class="hobby-section-title">🕐 Horaires</div>
                            <hr class="hobby-separator">
                            <div class="hobby-row" style="margin-top: 4px;">
                                <label>
                                    <input type="radio" name="heureMode" id="heureModeOu" value="ou" checked>
                                    <span id="labelHeureModeOu">Au moins une</span>
                                </label>
                                <label>
                                    <input type="radio" name="heureMode" id="heureModeEt" value="et">
                                    <span id="labelHeureModeEt">Exactement</span>
                                </label>
                            </div>
                            <div class="hobby-row">
                                <label><input type="checkbox" class="heure-cb" value="matin" checked> <span id="labelMatin">🌅 Matin</span></label>
                                <label><input type="checkbox" class="heure-cb" value="après-midi" checked> <span id="labelApresMidi">☀️ Après-midi</span></label>
                                <label><input type="checkbox" class="heure-cb" value="soir" checked> <span id="labelSoir">🌆 Soir</span></label>
                                <label><input type="checkbox" class="heure-cb" value="nuit" checked> <span id="labelNuit">🌙 Nuit</span></label>
                            </div>

                            <hr class="hobby-separator">
                            <div id="labelNiveauPassion" class="hobby-section-title">💗 Niveau de passion</div>
                            <hr class="hobby-separator">
                            <div class="hobby-row">
                                <label id="labelPeche">🐟 Pêche</label>
                                <select id="hobbyPoisson"></select>
                            </div>
                            <div class="hobby-row">
                                <label id="labelObservation">🪶 Observation des oiseaux</label>
                                <select id="hobbyOiseau"></select>
                            </div>
                            <div class="hobby-row">
                                <label id="labelAttrapage">🐛 Attrapage d'insectes</label>
                                <select id="hobbyInsecte"></select>
                            </div>

                            <hr class="hobby-separator">
                            <div class="hobby-row">
                                <label><input type="checkbox" id="cacherObtenus"> <span id="labelCacherObtenus">Cacher les obtenus</span></label>
                            </div>
                            <div class="hobby-row">
                                <label><input type="checkbox" id="afficherNonDebloques" checked> <span id="labelAfficherNonDebloques">Afficher non débloqués</span></label>
                            </div>
                            <hr class="hobby-separator">
                            <div class="filters">
                                <label><input type="checkbox" value="poisson" checked> <span id="labelFiltrePoissons">Poissons</span></label>
                                <label><input type="checkbox" value="oiseau" checked> <span id="labelFiltreOiseaux">Oiseaux</span></label>
                                <label><input type="checkbox" value="insecte" checked> <span id="labelFiltreInsectes">Insectes</span></label>
                                <label><input type="checkbox" value="collectible" checked> <span id="labelFiltreCollectibles">Collectibles</span></label>
                            </div>
                        </div>
                    </div>
                    <div id="legendeCollectibles">
                        <h3 id="legendeCollectiblesTitre" style="cursor: pointer;">🍄 Collectibles ▶</h3>
                        <div id="legendeList"></div>
                    </div>
                </div>

                <div id="mapColumn">
                    <div id="fauneSearchWrapper">
                        <div id="fauneSearchBar">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="fauneSearchInput" autocomplete="off">
                            <button id="fauneSearchClear" class="search-clear hidden">✕</button>
                        </div>
                    </div>
                    <div id="map-container">
                        <div id="map-inner">
                            <img src="./map/map.jpg" id="map" alt="Map du jeu Heartopia">
                        </div>
                    </div>
                </div>

                <div id="infoColumn">
                    <div id="panel">
                        <h3 id="placeTitle" onclick="toggleElementsPanel()">Aucun lieu sélectionné</h3>
                        <div id="elementsPanel" class="hidden">
                            <div id="elementsList"></div>
                        </div>
                    </div>
                    <div id="panelSpeciaux" class="hidden">
                        <h3><span id="panelSpeciauxTitre">⭐ Localisations spéciales</span> <button onclick="toggleSpecialLocations()">✖</button></h3>
                        <div id="speciauxList"></div>
                    </div>
                    <button id="btnSpeciaux" onclick="toggleSpecialLocations()">⭐ Localisations spéciales</button>
                </div>

            </div>
        </div>

        <div id="tab-tab2" class="tab-content">
            <div id="tabBarWildlife">
                <button class="tab-btn-wildlife active" id="btnWildlifePoisson" onclick="switchTabWildlife('poisson')">🐟 Poissons</button>
                <button class="tab-btn-wildlife" id="btnWildlifeOiseau" onclick="switchTabWildlife('oiseau')">🪶 Oiseaux</button>
                <button class="tab-btn-wildlife" id="btnWildlifeInsecte" onclick="switchTabWildlife('insecte')">🐛 Insectes</button>
            </div>
            <div class="FenetreObtenu active" id="ObtenuPoisson"></div>
            <div class="FenetreObtenu" id="ObtenuOiseau"></div>
            <div class="FenetreObtenu" id="ObtenuInsecte"></div>
        </div>

        <div id="tab-recipes" class="tab-content">
        </div>

    </div>
    <div id="adminPage">
    </div>

    <script src="js/dom-helpers.js"></script>
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/map.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/admin-page.js"></script>
    <script src="js/admin-recipe-slots.js"></script>
    <script src="js/admin-forms.js"></script>
    <script src="js/search.js"></script>
    <script src="js/recipes-helpers.js"></script>
    <script src="js/recipes-tabs.js"></script>
    <script src="js/recipes-profit-calc.js"></script>
    <script src="js/wildlife.js"></script>
    <script src="js/tabs.js"></script>
    <script src="js/init.js"></script>

</body>
</html>
